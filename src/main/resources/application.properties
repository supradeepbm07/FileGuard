spring.application.name=FileGuard

server.port=8080
server.servlet.context-path=/api

spring.datasource.url=jdbc:mysql://localhost:3307/fileguard?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=fileguard_user
spring.datasource.password=FileGuard@2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

fileguard.storage.upload-dir=./storage/uploads
fileguard.storage.encrypted-dir=./storage/encrypted
fileguard.storage.quarantine-dir=./storage/quarantine

fileguard.jwt.secret=FileGuardSuperSecureJwtSecretKey2026ForDevelopmentOnly
fileguard.jwt.expiration=86400000

logging.level.root=INFO
logging.level.com.fileguard=INFO

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata